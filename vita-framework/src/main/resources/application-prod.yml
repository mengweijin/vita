spring:
  liquibase:
    contexts: prod
    change-log: classpath:/db/db.changelog-h2.xml
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./h2/vita;DB_CLOSE_ON_EXIT=FALSE;IGNORECASE=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: false
      path: /h2
      settings:
        web-allow-others: false
  data:
    redis:
      database: 0
      host: localhost
      port: 6379
      password:
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
decorator:
  datasource:
    enabled: false
